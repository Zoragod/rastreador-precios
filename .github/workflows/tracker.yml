name: Rastreador Automático de Precios

on:
  schedule:
    # Se ejecuta automáticamente 2 veces al día:
    # 8:00 AM hora de Perú (13:00 UTC) y 6:00 PM hora de Perú (23:00 UTC)
    - cron: '0 13,23 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar rastreo y enviar alertas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_NOTIFICACION: ${{ secrets.EMAIL_NOTIFICACION }}
        run: python check_prices.py
